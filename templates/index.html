<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBotServe - Admin Panel</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>IBotServe</h1>
                <p class="subtitle">Userbot Manager</p>
            </div>

            <div class="sidebar-section">
                <h3>UserBots</h3>
                <div id="userbots-list" class="userbots-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Configuration Panel</h2>
                <div class="header-actions">
                    <button id="create-group-btn" class="btn btn-success">
                        <span class="btn-icon">➕</span>
                        Create Group
                    </button>
                    <button id="update-data-btn" class="btn btn-primary">
                        <span class="btn-icon">🔄</span>
                        Update Data
                    </button>
                </div>
            </header>

            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Session Files</h3>
                        <span id="session-count" class="badge">0</span>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">
                            Click "Update Data" to scan the sessions folder and import new userbots into the database.
                        </p>
                    </div>
                </div>

                <div id="notification" class="notification hidden"></div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-content">
                            <div class="stat-value" id="total-userbots">0</div>
                            <div class="stat-label">Total UserBots</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">📁</div>
                        <div class="stat-content">
                            <div class="stat-value" id="total-sessions">0</div>
                            <div class="stat-label">Session Files</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">🔗</div>
                        <div class="stat-content">
                            <div class="stat-value" id="total-groups">0</div>
                            <div class="stat-label">Groups</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Creating Group -->
    <div id="create-group-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Telegram Group</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="create-group-form">
                <div class="form-group">
                    <label for="group-name">Group Name:</label>
                    <input type="text" id="group-name" name="group-name" required placeholder="Enter group name">
                </div>

                <div class="form-group">
                    <label for="admin-userbot">Admin (Creator):</label>
                    <select id="admin-userbot" name="admin-userbot" required>
                        <option value="">Select admin userbot...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="member-userbots">Members to add:</label>
                    <div id="member-userbots" class="checkbox-group">
                        <div class="loading">Loading userbots...</div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-success">Create Group</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
